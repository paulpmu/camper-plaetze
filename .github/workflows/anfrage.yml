name: Anfrage aus der Webapp verarbeiten

# Die Webapp öffnet ein Issue mit Titel «[Ziel] …». Verarbeitet werden nur Issues und Kommentare
# der Repository-Inhaberin bzw. des -Inhabers; Antworten des Bots lösen keinen neuen Lauf aus.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  anfrage:
    if: >-
      startsWith(github.event.issue.title, '[Ziel]') &&
      github.event.issue.state == 'open' &&
      !github.event.issue.pull_request &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: claude
        name: Anfrage mit Claude auswerten
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python scripts/anfrage.py
      - name: Ziel und Kosten speichern
        if: always() && steps.claude.outcome == 'success'
        env:
          ZIEL: ${{ steps.claude.outputs.ziel }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "camper-plaetze-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ziele docs/data/kosten.json
          git diff --staged --quiet && exit 0
          git commit -m "Anfrage #${ISSUE_NUMBER} verarbeitet ${ZIEL}"
          git pull --rebase origin main
          git push
      - name: Antworten
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SCHLIESSEN: ${{ steps.claude.outputs.schliessen }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/anfrage/antwort.md
          if [ "$SCHLIESSEN" = "true" ]; then gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"; fi
      - name: Abruf starten
        if: steps.claude.outputs.aktion == 'neu' || steps.claude.outputs.aktion == 'aendern' || steps.claude.outputs.aktion == 'aktualisieren' || steps.claude.outputs.aktion == 'deaktivieren'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIEL: ${{ steps.claude.outputs.ziel }}
          AKTION: ${{ steps.claude.outputs.aktion }}
        run: |
          # Beim Deaktivieren genügt es, die Webapp neu zu veröffentlichen
          if [ "$AKTION" = "deaktivieren" ]; then ZIEL="-"; fi
          gh workflow run update.yml --repo "$GITHUB_REPOSITORY" --ref main -f ziel="$ZIEL"
